name: Sync observation v0.3.8 r10
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='529846fcac65b1f58246a50303121ceaafa849bf';old='00bf92f57f446f6243638e20060a05c6f191c9fd';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/observation-v038-r10.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='a37c110193205238bf583b0b4e532d3394735dc3d6da397a18fb635d55fd6289'
          p=pathlib.Path('/tmp/observation-v038-r10.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r10')
          assert git('rev-parse','refs/remotes/bundle/v038-r10')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-24-v038-r10-observe'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
