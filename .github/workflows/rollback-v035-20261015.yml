name: Sync bounded viewport placement v0.3.8 r7
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='b74e131a5e430ebcb339683db7b59e28aa5cdab7';old='a5b0ed8bec126e8d8258422584fb8193858e1201';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/position-loop-v038-r7.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='081f4c6731e40e84d3652dd7aa27d3c6d7cb51f6b6accd96f9f9d17934586c36'
          p=pathlib.Path('/tmp/position-loop-v038-r7.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r7')
          assert git('rev-parse','refs/remotes/bundle/v038-r7')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-24-v038-r7'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
