name: Sync speaker-label and cache fixes v0.3.8 r2
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='ad98b849fd72b2e4127b8d17a0541dea32a70133';old='e752b06cadaa270d41cb57a6a5838c58afe4ae57';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/speaker-label-v038-r2.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='4da51542534154fbe3787b69fd97e56e39bb7aa87ac6d6b10d2a6aa5ba2c0bb9'
          p=pathlib.Path('/tmp/speaker-label-v038-r2.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r2')
          assert git('rev-parse','refs/remotes/bundle/v038-r2')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-18-v038-r2'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
