name: Sync new prompt indexing fix
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify and push exact work branch commit
        run: |
          python3 - <<'PY'
          import json,os, pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          head='3b3dd5de89a52637f3fb118b9508415a7086a174'
          ref='refs/heads/fix/auto-index-new-prompts'
          raw=base64.b64decode(pathlib.Path('recovery/auto-index-new-prompts.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='57b2b93add70133c2aab24f65d1f64995cca3f5cb539b26491cbf58ecc20abb9'
          p=pathlib.Path('/tmp/new-prompts.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/new-prompts')
          assert git('rev-parse','refs/remotes/bundle/new-prompts')==head
          assert git('rev-parse',head+'^')=='33647255042b7cff3525548bad7bd69cd55791e1'
          assert json.loads(git('show',head+':package.json'))['version']=='0.3.8'
          assert not git('ls-remote','origin',ref) or git('ls-remote','origin',ref).split()[0]==head
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
