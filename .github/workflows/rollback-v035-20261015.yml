name: Sync lookup and directory clear v0.3.7 r3
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='b740f8101fdcefd67ec46c47eec2e1ae4fd52c59';old='75f2f682191a5fe5d0aa2308ca02fb701b7ad274';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/highlight-clear-v037-r3.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='84bdd7c1797ab6c3700cdc6bf2d67d438bea88afb014a37e8414d810c7435bc2'
          p=pathlib.Path('/tmp/highlight-clear-v037-r3.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/r3037')
          assert git('rev-parse','refs/remotes/bundle/r3037')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.7' and p['tocRevision']=='2026-11-17-v037-r3'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
