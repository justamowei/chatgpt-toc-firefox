name: Sync restore early navigation v0.3.8 r8
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='f16791ef875bb9f25feb1b1fb9ff5cd130013b1e';old='b74e131a5e430ebcb339683db7b59e28aa5cdab7';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/restore-navigation-v038-r8.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='90fb00b47a886b772f9ab4d26b76446018d4165cce86dd2e09f096ead113c609'
          p=pathlib.Path('/tmp/restore-navigation-v038-r8.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r8')
          assert git('rev-parse','refs/remotes/bundle/v038-r8')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-24-v038-r8'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
