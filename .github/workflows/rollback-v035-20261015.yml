name: Sync clear recollection and navigation fixes v0.3.8 r3
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='c3776ce61bef4ef33c17562de199b2380331b8d3';old='ad98b849fd72b2e4127b8d17a0541dea32a70133';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/clear-recollect-v038-r3.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='9540e0218c92fb1753fb9ec6a23bdee3b1fd5df927fea664b450b937b82bf7a5'
          p=pathlib.Path('/tmp/clear-recollect-v038-r3.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r3')
          assert git('rev-parse','refs/remotes/bundle/v038-r3')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-24-v038-r3'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
