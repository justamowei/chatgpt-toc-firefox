name: Sync v0.3.6 r3 prompt fixes
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync exact source commit
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          head='e2798aca44d726c45fc31897e8fd39d4a2136683'
          old='f5805b4ff8db39139b7d6b9927258a03143b9803'
          ref='refs/heads/fix/auto-index-new-prompts'
          raw=base64.b64decode(pathlib.Path('recovery/auto-index-v036-r3.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='c26a1a981ce2955bf407ad71b3b84f479539be23b63b831bf09fc00af5504cea'
          path=pathlib.Path('/tmp/auto-index-v036-r3.bundle');path.write_bytes(raw)
          git('bundle','verify',str(path));git('fetch','--no-tags',str(path),ref+':refs/remotes/bundle/new-prompts')
          assert git('rev-parse','refs/remotes/bundle/new-prompts')==head
          assert git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.6' and p['tocRevision']=='2026-11-17-v036-r3'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
