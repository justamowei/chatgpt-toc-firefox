name: Sync flat prompt directory v0.3.7 r2
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='75f2f682191a5fe5d0aa2308ca02fb701b7ad274';old='3367d57fbaedcae31dbdee8b788b910dfb48dc83';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/flat-toc-v037-r2.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='f5b5fda81198d03695052883d630ab47d27209a7c5709b2d471fa1dc40a01b6c'
          p=pathlib.Path('/tmp/flat-toc-v037-r2.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/flat037')
          assert git('rev-parse','refs/remotes/bundle/flat037')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.7' and p['tocRevision']=='2026-11-17-v037-r2'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
