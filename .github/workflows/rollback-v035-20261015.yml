name: Sync collection consistency v0.3.7 r4
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='2ee60777b17501461602022f41f40ec01a9b9030';old='b740f8101fdcefd67ec46c47eec2e1ae4fd52c59';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/collection-consistency-v037-r4.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='7d6b7f57f682335f5a516a785d2d9c3a4f4b0d6190f9fe2a34a8bead04bf21ad'
          p=pathlib.Path('/tmp/collection-consistency-v037-r4.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/r4037')
          assert git('rev-parse','refs/remotes/bundle/r4037')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.7' and p['tocRevision']=='2026-11-17-v037-r4'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
