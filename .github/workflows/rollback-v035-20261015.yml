name: Sync renderer rebuild fix v0.3.8 r11
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='33d08408fad3944aee8fe445a611a0734c7ac36e';old='529846fcac65b1f58246a50303121ceaafa849bf';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/rebuild-v038-r11.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='4d69f25af7c22115495253397054a2cfe8270cbb42d04cbe0b5889fed107ba8b'
          p=pathlib.Path('/tmp/rebuild-v038-r11.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r11')
          assert git('rev-parse','refs/remotes/bundle/v038-r11')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-24-v038-r11'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
