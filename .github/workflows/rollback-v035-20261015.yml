name: Sync v0.3.7 reference navigation v0.3.8 r9
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='00bf92f57f446f6243638e20060a05c6f191c9fd';old='f16791ef875bb9f25feb1b1fb9ff5cd130013b1e';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/reference-v037-v038-r9.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='39f69b67c0a0da30778cee56d68030289aa6d15cc84ff3ffc5cc3cee9cc844c6'
          p=pathlib.Path('/tmp/reference-v037-v038-r9.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038-r9')
          assert git('rev-parse','refs/remotes/bundle/v038-r9')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-24-v038-r9'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
