name: Sync 20-minute collection limit v0.3.8
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='e752b06cadaa270d41cb57a6a5838c58afe4ae57';old='caad4735ef7b1f270f897bd019840110b0e872b5';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/collection-limit-v038.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='f0830461c587c664bde5f25ddb8bb33f9aca15ecd495879908a458a3aa1219e9'
          p=pathlib.Path('/tmp/collection-limit-v038.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/v038')
          assert git('rev-parse','refs/remotes/bundle/v038')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.8' and p['tocRevision']=='2026-11-18-v038'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
