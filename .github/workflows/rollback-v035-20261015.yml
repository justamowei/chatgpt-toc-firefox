name: Sync delayed history and copy actions v0.3.7 r5
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='6fc76c5fabf7bdb4cd3eea364cc9bfd9b2a1de30';old='2ee60777b17501461602022f41f40ec01a9b9030';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/grace-copy-v037-r5.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='70ec32984ccbe6696f95f0402de9cc37246b0eac772a36c6be30c45d37e5826f'
          p=pathlib.Path('/tmp/grace-copy-v037-r5.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/r5037')
          assert git('rev-parse','refs/remotes/bundle/r5037')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.7' and p['tocRevision']=='2026-11-17-v037-r5'
          assert git('ls-remote','origin',ref).split()[0] in (old,head)
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
