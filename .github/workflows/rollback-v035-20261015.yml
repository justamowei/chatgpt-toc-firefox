name: Sync v0.3.7 group navigation candidate
on:
  push:
    branches: [chore/rollback-v035-20261015]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync fixed candidate source
        run: |
          python3 - <<'PY'
          import os,json,pathlib,base64,hashlib,subprocess
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          head='3367d57fbaedcae31dbdee8b788b910dfb48dc83';old='d5f85b5bb946f31b610d87aaf0655f90df97704e';ref='refs/heads/fix/prompt-group-navigation'
          raw=base64.b64decode(pathlib.Path('recovery/candidate-group-v037.bundle.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='6fa7244d8c92e5e7625d17763701c82ea20b66ef43f20c7f7dcfdc7ecd73438a'
          p=pathlib.Path('/tmp/candidate-group-v037.bundle');p.write_bytes(raw)
          git('bundle','verify',str(p));git('fetch','--no-tags',str(p),ref+':refs/remotes/bundle/group037')
          assert git('rev-parse','refs/remotes/bundle/group037')==head and git('rev-parse',head+'^')==old
          p=json.loads(git('show',head+':package.json'))
          assert p['version']=='0.3.7'
          before=git('ls-remote','origin',ref)
          assert not before or before.split()[0]==head
          assert git('ls-remote','origin','refs/heads/release/v0.3').split()[0]==old
          assert git('ls-remote','origin','refs/tags/v0.3.6').split()[0]=='8d9e701080b45e67b1fe6c53394fb76d0c2b7e4d'
          git('push','--atomic','origin',head+':'+ref)
          assert git('ls-remote','origin',ref).split()[0]==head
          PY
