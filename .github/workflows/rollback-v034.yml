name: Sync user-authorized v0.3.4 rollback
on:
  push:
    branches: [chore/rollback-v034-sync]
    paths: [recovery/rollback-v034.json]
permissions:
  contents: write
concurrency:
  group: toc-v034-rollback
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'justamowei/chatgpt-toc-firefox' && github.ref == 'refs/heads/chore/rollback-v034-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify original rollback bundle and fast-forward release
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys, tempfile, urllib.request, urllib.error
          repo = 'justamowei/chatgpt-toc-firefox'
          assert sys.platform == 'linux' and os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('GITHUB_REPOSITORY') == repo
          assert os.environ.get('GITHUB_REF') == 'refs/heads/chore/rollback-v034-sync'
          token = os.environ['GITHUB_TOKEN']
          def api(path, method='GET', data=None, missing=False):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(('https://api.github.com/repos/' + repo + '/' + path).rstrip('/'), data=body, method=method, headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'toc-authorized-v034-rollback','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return None if response.status == 204 else json.load(response)
              except urllib.error.HTTPError as e:
                  if missing and e.code == 404: return None
                  raise RuntimeError('GitHub HTTP '+str(e.code)) from None
          record=api('contents/recovery/rollback-v034.json?ref='+os.environ['GITHUB_SHA'])
          cfg=json.loads(base64.b64decode(record['content']))
          assert cfg['source']=='ab0877a4827a06e679ffabe6d8be520123352511'
          assert cfg['parent']=='fed5380db1ebb7b0c3fbe7a6146f6a343ebda574'
          assert cfg['baseline']=='25b46d412e6aa7af451eb7a507b47c291a9ade66'
          assert api('')['private'] is True
          assert api('git/ref/heads/release/v0.3')['object']['sha']==cfg['parent']
          assert api('git/ref/heads/main')['object']['sha']==cfg['main']
          assert len(cfg['preservedTags'])==8
          for item in cfg['preservedTags']:
              assert api('git/ref/'+item['ref'][5:])['object']['sha']==item['sha']
          for tag in ['v0.3.5','v0.3.6','snapshot/v0.3.5/2026-10-08-rebuild','snapshot/v0.3.6/2026-10-08-r2']:
              assert api('git/ref/tags/'+tag, missing=True) is None
          with tempfile.TemporaryDirectory() as folder:
              root=pathlib.Path(folder)
              bundle=base64.b64decode(cfg['bundle'])
              assert hashlib.sha256(bundle).hexdigest()==cfg['bundleHash']
              bundle_path=root/'rollback.bundle'
              bundle_path.write_bytes(bundle)
              work=root/'git'
              env=dict(os.environ)
              env.update(GIT_CONFIG_COUNT='2', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode(), GIT_CONFIG_KEY_1='credential.helper', GIT_CONFIG_VALUE_1='')
              def git(*args):
                  p=subprocess.run(['git',*args], cwd=work if work.exists() else root, env=env, capture_output=True)
                  if p.returncode: raise RuntimeError('Cloud Git operation failed: '+args[0])
                  return p.stdout.decode().strip()
              git('init','--bare',str(work))
              url='https://github.com/'+repo+'.git'
              git('fetch','--no-tags',url,'refs/heads/release/v0.3:refs/heads/imported-base')
              assert git('rev-parse','refs/heads/imported-base')==cfg['parent']
              git('bundle','verify',str(bundle_path))
              git('fetch',str(bundle_path),'refs/heads/release/v0.3:refs/heads/restored')
              assert git('rev-parse','refs/heads/restored')==cfg['source']
              assert git('rev-parse',cfg['source']+'^{tree}')==cfg['tree']
              assert git('rev-parse',cfg['source']+'^')==cfg['parent']
              assert not git('diff','--name-only',cfg['baseline'],cfg['source'],'--','src','scripts','manifests','package.json','package-lock.json','tsconfig.json')
              for path in ['package.json','package-lock.json','manifests/firefox.json']:
                  assert json.loads(git('show',cfg['source']+':'+path))['version']=='0.3.4'
              assert api('git/ref/heads/release/v0.3')['object']['sha']==cfg['parent']
              assert api('git/ref/heads/main')['object']['sha']==cfg['main']
              git('push',url,cfg['source']+':refs/heads/release/v0.3')
              assert api('git/ref/heads/release/v0.3')['object']['sha']==cfg['source']
              mapping={'docs/main-readme.md':'README.md','docs/main-development-plan.md':'docs/development-plan.md','docs/version-policy.md':'docs/version-policy.md','docs/version-catalog.json':'docs/version-catalog.json','docs/versions.md':'docs/versions.md','docs/rollback-2026-10-10.md':'docs/rollback-2026-10-10.md'}
              elements=[{'path':target,'mode':'100644','type':'blob','sha':git('rev-parse',cfg['source']+':'+source)} for source,target in mapping.items()]
              tree=api('git/trees','POST',{'base_tree':cfg['mainTree'],'tree':elements})
              commit=api('git/commits','POST',{'message':'docs: record user-authorized v0.3.4 rollback and retired version removal','tree':tree['sha'],'parents':[cfg['main']]})
              assert api('git/ref/heads/main')['object']['sha']==cfg['main']
              api('git/refs/heads/main','PATCH',{'sha':commit['sha'],'force':False})
              assert api('git/ref/heads/main')['object']['sha']==commit['sha']
              print('MAIN_DOCUMENTATION_COMMIT '+commit['sha'])
          for item in cfg['preservedTags']:
              assert api('git/ref/'+item['ref'][5:])['object']['sha']==item['sha']
          assert api('')['private'] is True
          print('ROLLBACK_SYNC_VERIFIED '+cfg['source'])
          PY
