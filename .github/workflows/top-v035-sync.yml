name: Sync original v0.3.5 source and immutable tag
on:
  push:
    branches: [chore/top-v035-sync]
    paths: [recovery/top-v035.json]
permissions:
  contents: write
concurrency:
  group: toc-original-v035-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify pinned program and sync original objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo='justamowei/chatgpt-toc-firefox'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/chore/top-v035-sync'
          url='https://api.github.com/repos/'+repo+'/contents/recovery/sync-renumber-v035.py?ref='+os.environ['GITHUB_SHA']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'toc-v035-bootstrap'})
          with urllib.request.urlopen(req,timeout=30) as r: obj=json.load(r)
          program=base64.b64decode(obj['content'])
          assert hashlib.sha256(program).hexdigest()=='7cd2cd91e6661ddbcf99986a981ff7b5a2dbb96c172e54741f65d422a1550165'
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'toc-v035-sync.py'
          file.write_bytes(program)
          subprocess.run(['python3',str(file)],check=True)
          PY
