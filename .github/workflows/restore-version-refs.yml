name: Restore original version refs
on:
  push:
    branches: [chore/version-governance-sync]
    paths: [recovery/version-governance.json]
permissions:
  contents: write
concurrency:
  group: version-governance-sync
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'justamowei/chatgpt-toc-firefox' && github.ref == 'refs/heads/chore/version-governance-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the pinned reviewed recovery program and restore refs
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'justamowei/chatgpt-toc-firefox'
          url = 'https://api.github.com/repos/justamowei/chatgpt-toc-firefox/contents/scripts/restore-version-refs.py?ref=' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'toc-version-governance'})
          with urllib.request.urlopen(request, timeout=45) as response:
              record = json.load(response)
          program = base64.b64decode(record['content'])
          assert hashlib.sha256(program).hexdigest() == 'ee695cc0ec2bd93d67c0dfcf8ebc8130dea6c3e657bc2caf40b3ced71b37da9e', 'Recovery source hash mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'restore-version-refs.py'
          target.write_bytes(program)
          subprocess.run(['python3', str(target)], check=True)
          PY
